<svg xmlns="http://www.w3.org/2000/svg" width="400" height="260" viewBox="0 0 400 260">
  <!-- PLACEHOLDER: shown on event cards when an event has no poster. Replace freely (keep the file name).
       "Harbor" palette: solid Blue backdrop (no glow), sand calendar and label. -->
  <rect width="400" height="260" fill="#213e60"/>
  <g fill="none" stroke="#d8d1bd" stroke-width="6" stroke-linejoin="round">
    <rect x="150" y="80" width="100" height="90" rx="10"/>
    <line x1="150" y1="104" x2="250" y2="104"/>
    <line x1="175" y1="68" x2="175" y2="90" stroke-linecap="round"/>
    <line x1="225" y1="68" x2="225" y2="90" stroke-linecap="round"/>
  </g>
  <text x="200" y="208" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="18" font-weight="700" fill="#d8d1bd" letter-spacing="1">CAMPUS EVENT</text>
</svg>
