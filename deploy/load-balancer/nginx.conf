# Campus Event Hub load balancer: spreads visitors over the app servers.
# A server that stops answering is skipped until it recovers, so the site
# keeps working while one is down or being updated.

upstream event_hub {
    # Each new request goes to the server with the fewest requests in progress.
    least_conn;
    server app1:80 max_fails=3 fail_timeout=15s;
    server app2:80 max_fails=3 fail_timeout=15s;
    server app3:80 max_fails=3 fail_timeout=15s;
    keepalive 32;
}

# Per-visitor limits, so one person (or a script) can't flood the site.
limit_req_zone $binary_remote_addr zone=per_ip:10m rate=20r/s;
limit_conn_zone $binary_remote_addr zone=conn_ip:10m;

server {
    listen 80;
    server_name _;

    client_max_body_size 10m;   # event posters (5 MB) and Excel imports
    server_tokens off;

    location / {
        limit_req zone=per_ip burst=60 nodelay;
        limit_conn conn_ip 30;
        limit_req_status 429;

        proxy_pass http://event_hub;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        # The app reads these (TRUSTED_PROXIES) for the visitor's IP and https.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # If a server fails mid-request, try the next one (safe requests only).
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_connect_timeout 5s;
        # The assistant can take a while to answer.
        proxy_read_timeout 120s;
    }

    # Images, CSS and JS change rarely: let browsers keep them for a day.
    location /assets/ {
        proxy_pass http://event_hub;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 1d;
    }

    # Which server answered: open /lb-status to check the balancing works.
    location = /lb-status {
        proxy_pass http://event_hub/health.php;
        proxy_set_header Host $host;
    }
}
